[package]
name = "smart-panda"
version = "0.1.0"
authors = ["h3nnn4n <uber.renan@gmail.com>"]
edition = "2021"

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
cfg-if = "1"
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
