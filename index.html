<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Panda -&gt; Tetris</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
    }

    #agent-mode {
      display: inline-flex;
    }

    #agent-mode label {
      border: 1px solid #888;
      padding: 4px 12px;
      cursor: pointer;
      user-select: none;
    }

    #agent-mode label.active {
      background: #ddd;
    }

    #agent-mode input {
      display: none;
    }

    .container {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .monospaced-text {
      white-space: pre;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <script type="module" src="/index.js"></script>

  <div id="agent-mode">
    <label>
      <input type="radio" name="agent-mode" value="random" autocomplete="off"> Random
    </label>
    <label>
      <input type="radio" name="agent-mode" value="learning" autocomplete="off" checked> Learning
    </label>
  </div>

  <div class="container">
    <canvas id="tetris-canvas"></canvas>
    <div class="monospaced-text">
      <!-- <div id="fps"></div> -->
      <div id="score"></div>
      <div id="feature-functions"></div>
    </div>
  </div>
</body>

</html>
